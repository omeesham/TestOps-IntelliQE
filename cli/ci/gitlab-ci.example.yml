# Example GitLab CI config — copy to .gitlab-ci.yml (or include it) in the repo
# you want to gate. It runs the IntelliQE API suite (import → design → execute →
# heal → report) and fails the pipeline on a regression or SLA/gate breach.
#
# CI/CD variables to set (Settings → CI/CD → Variables), both "Masked":
#   INTELLIQE_URL    e.g. https://intelliqe.your-company.com
#   INTELLIQE_TOKEN  a token from `intelliqe-api login` or POST /api/auth/login
#
# Exit codes: 0 ok · 1 usage · 2 API error · 3 quality gate failed (fails the job).

stages:
  - test

api-tests:
  stage: test
  image: node:20
  variables:
    # Override SPEC_URL per-project, or swap --url for `endpoints.json --env …`.
    SPEC_URL: "https://api.acme.com/openapi.json"
  script:
    - npm i -g @intelliqe/api-cli
    - >
      intelliqe-api run
      --url "$SPEC_URL"
      --env Staging
      --coverage standard
      --layers smoke,contract,negative,auth,flow
      --title "CI — $CI_COMMIT_REF_NAME @ $CI_COMMIT_SHORT_SHA"
      --wait
      --junit intelliqe-junit.xml
      --min-pass-rate 95
      --max-failures 2
  artifacts:
    when: always
    paths:
      - intelliqe-junit.xml
    reports:
      junit: intelliqe-junit.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'   # add a nightly pipeline schedule in the UI
