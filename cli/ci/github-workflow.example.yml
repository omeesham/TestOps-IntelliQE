# Example GitHub Actions workflow — copy to .github/workflows/api-tests.yml
# in the repo you want to gate. It runs the API suite on push, on a nightly
# schedule, and on demand; the job fails if any scenario regresses.
#
# Secrets to set (Settings → Secrets and variables → Actions):
#   INTELLIQE_URL    e.g. https://intelliqe.your-company.com
#   INTELLIQE_TOKEN  a token minted with `intelliqe-api login` or POST /api/auth/login
name: API tests (IntelliQE)

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'   # nightly at 02:00 UTC
  workflow_dispatch: {}

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run IntelliQE API Automation
        uses: ./cli/ci
        with:
          url: ${{ secrets.INTELLIQE_URL }}
          token: ${{ secrets.INTELLIQE_TOKEN }}
          source: https://api.acme.com/openapi.json
          env: Staging
          coverage: standard
          layers: smoke,contract,negative,auth,flow
          title: CI — ${{ github.ref_name }} @ ${{ github.sha }}
