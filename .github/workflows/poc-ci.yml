name: POC build check

# Runs on every PR to a POC branch and on pushes to them: installs, builds the
# backend and frontend, and builds the container image (not pushed anywhere).

on:
  pull_request:
    branches: [ 'poc/**' ]
  push:
    branches: [ 'poc/**' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend install and build
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Frontend install and build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Container image build (no push)
        run: docker build -t intelliqe:ci .
