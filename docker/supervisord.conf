[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/run/supervisord.pid

[program:api]
command=node dist/index.js
directory=/app/backend
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Pipeline worker. Disable by running the container with RUN_WORKER=false.
# Requires ANTHROPIC_API_KEY, WORKER_SECRET, BACKEND_URL to be set.
[program:worker]
command=node dist/worker/index.js
directory=/app/backend
autostart=%(ENV_RUN_WORKER)s
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
